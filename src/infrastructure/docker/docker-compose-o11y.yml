services:
  # ---------------------------------------------------------------------------
  # 1. Local OpenTelemetry Collector (Mock Gateway / Terminal Debugger)
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: local-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-local-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4318:4318" # OTLP HTTP receiver

  # ---------------------------------------------------------------------------
  # 2. Local .NET Application Container
  # ---------------------------------------------------------------------------
  care-leavers-web:
    build:
      context: ../../
      dockerfile: web/CareLeavers.Web/Dockerfile
      args:
        - BUILD_CONFIGURATION=Debug
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=care-leavers-local
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local,service.version=1.0.0
    depends_on:
      - otel-collector