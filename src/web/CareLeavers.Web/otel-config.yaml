receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:${SPLUNK_PORT}"

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch:
    send_batch_size: 10000
    timeout: 2s
  resource:
    attributes:
      - key: service.name
        value: "${OTEL_SERVICE_NAME}"
        action: upsert

exporters:
  debug:
    verbosity: detailed

  otlphttp/logs:
    logs_endpoint: "https://ingest.${SPLUNK_REALM}.observability.splunkcloud.com/v2/event/otlp"
    tls:
      insecure: false
    headers:
      "X-SF-Token": "${SPLUNK_ACCESS_TOKEN}"

  otlphttp/traces:
    traces_endpoint: "https://ingest.${SPLUNK_REALM}.observability.splunkcloud.com/v2/trace/otlp"
    tls:
      insecure: false
    headers:
      "X-SF-Token": "${SPLUNK_ACCESS_TOKEN}"

  otlphttp/metrics:
    metrics_endpoint: "https://ingest.${SPLUNK_REALM}.observability.splunkcloud.com/v2/datapoint/otlp"
    tls:
      insecure: false
    headers:
      "X-SF-Token": "${SPLUNK_ACCESS_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/traces, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/logs, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/metrics, debug]