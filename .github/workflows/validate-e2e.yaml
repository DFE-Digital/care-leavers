name: Validate - E2E Tests

on:
  push:
    branches: ["main"]
    paths:
      - "src/web/**"
      - "src/e2e/CareLeavers.E2ETests/**"
      - ".github/workflows/validate-web.yaml"
      - ".github/workflows/validate-e2e.yaml"
  pull_request:
    branches: ["main"]
    
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Playwright Tests    
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5]
        shardTotal: [5]        
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Lowercase the repo name and username
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Create Local Developer Certificate
        run: |
          mkdir -p ${HOME}/.aspnet/https
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:$SSL_CERT_DIR"
          dotnet dev-certs https -ep ${HOME}/.aspnet/https/aspnetapp.pfx -p "e2e"
          dotnet dev-certs https --trust
          chmod -R 755 ${HOME}/.aspnet

      - name: Build Web Docker Image
        id: build
        working-directory: ./src
        run: docker build . -t care-leavers-web:e2e -f web/CareLeavers.Web/Dockerfile

      - name: Run E2E Docker Image
        id: run
        if: steps.build.outcome == 'success'
        working-directory: ./src
        run: |
          docker compose -f infrastructure/docker/docker-compose-ci.yml up -d
        env:
          CONTENTFUL_DELIVERY_API_KEY: ${{ secrets.CONTENTFUL_DELIVERY_API_KEY }}
          CONTENTFUL_PREVIEW_API_KEY: ${{ secrets.CONTENTFUL_PREVIEW_API_KEY }}
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}

      - name: Install dependencies
        working-directory: ./src/e2e/CareLeavers.E2ETests
        run: yarn install --immutable --immutable-cache

      - name: Install Playwright Browsers
        working-directory: ./src/e2e/CareLeavers.E2ETests       
        run: yarn playwright install --with-deps

      - name: Run Playwright Tests - ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        if: steps.run.outcome == 'success'
        working-directory: ./src/e2e/CareLeavers.E2ETests
        run: yarn playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} -c playwright-ci.config.ts

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
        
          name: playwright-report-${{ matrix.shardIndex }}
          path: ./src/e2e/CareLeavers.E2ETests/playwright-report/
          if-no-files-found: ignore

      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-screenshots
          path: ./src/e2e/CareLeavers.E2ETests/test-results/screenshots/
  MergeReport:
    runs-on: ubuntu-latest
    name: Download Merged Report
    needs: tests
    steps:
      - name: Download all Playwright report artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c 
        with:          
          path: ./artifacts

      - name: Assemble merged report
        run: |
          set -euo pipefail
          mkdir -p merged-report
          cd artifacts || exit 1
          # move each downloaded shard report into merged-report/shard-<n>
          for d in *; do
            if [ -d "$d" ]; then
              mv "$d" ../merged-report/"$d"
            fi
          done
          cd ../merged-report
          # create a simple index that links to each shard's index.html
          echo "<html><head><meta charset=\"utf-8\"><title>Merged Playwright Report</title></head><body><h1>Merged Playwright Report</h1><ul>" > index.html
          for d in *; do
            if [ -d "$d" ]; then
              # assume each shard report has an index.html at its root
              echo "<li><a href=\"$d/index.html\">$d</a></li>" >> index.html
            fi
          done
          echo "</ul></body></html>" >> index.html

      - name: Upload merged Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-merged
          path: ./merged-report
          if-no-files-found: ignore
